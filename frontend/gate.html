<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>HAIL OS — Access Gate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{ --gold:#d4af37; --bg:#0b1220 }
    .glass{backdrop-filter:blur(16px); background:rgba(13,18,34,.55); border:1px solid rgba(255,255,255,.06)}
    .orb{position:absolute; filter:blur(80px); opacity:.28; pointer-events:none}
  </style>
</head>
<body class="min-h-screen bg-[#0a0f1a] text-slate-100 grid place-items-center relative">
  <div class="orb w-[40vw] h-[40vw] rounded-full bg-yellow-500/20 -left-[10vw] top-[10vh] absolute"></div>
  <div class="orb w-[30vw] h-[30vw] rounded-full bg-amber-300/10 right-[5vw] bottom-[8vh] absolute"></div>

  <div class="w-[92vw] max-w-md glass rounded-2xl p-6">
    <div class="flex items-center gap-3 mb-4">
      <div class="size-9 grid place-items-center rounded-lg bg-[var(--gold)] text-black font-black">H</div>
      <div>
        <div class="font-semibold">HAIL OS</div>
        <div class="text-xs text-slate-400">Access Gate</div>
      </div>
    </div>

    <h1 class="text-xl font-semibold">Enter your email to continue</h1>
    <p class="text-sm text-slate-400 mt-1">We use your email to enroll you in the beta and improve access security.</p>

    <form id="f" class="mt-4 grid gap-3" onsubmit="return submitEmail(event)">
      <input id="email" type="email" required placeholder="you@example.com"
             class="w-full rounded-lg bg-slate-900/70 border border-slate-700 px-3 py-2 outline-none focus:border-yellow-500">
      <button class="rounded-lg bg-[var(--gold)] text-black font-semibold py-2 hover:brightness-110">Continue to HAIL</button>
      <div id="msg" class="text-sm text-slate-400"></div>
    </form>

    <div class="text-xs text-slate-500 mt-4">“All actions guided by Qur’an & Sunnah. We do not train AI on your personal data.”</div>

    <div class="mt-4 text-center">
      <a href="/" class="text-slate-400 hover:text-slate-200 text-sm">← Back to Home</a>
    </div>
  </div>

  <script>
    async function submitEmail(e){
      e.preventDefault();
      const el = document.getElementById('email');
      const msg = document.getElementById('msg');
      const email = (el.value||'').trim();

      if(!/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(email)){
        msg.textContent = 'Please enter a valid email.';
        return false;
      }

      try{
        const res = await fetch('/beta_signup', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email})
        });
        const data = await res.json();
        if(data?.ok){
          localStorage.setItem('hail_email', email);
          msg.textContent = 'Saved ✓ Redirecting…';
          setTimeout(()=> location.href='/app', 400);
        }else{
          msg.textContent = data?.message || 'Could not save email.';
        }
      }catch(e){
        msg.textContent = 'Network error.';
      }
      return false;
    }
  </script>
</body>
</html>
