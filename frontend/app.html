<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>HAIL — Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .msg{max-width:72%; border-radius:1rem; padding:.75rem 1rem}
    .msg-bot{background:#111827; border:1px solid rgba(255,255,255,.06)}
    .msg-user{background:#10b981; color:#06281e}
  </style>
</head>
<body class="bg-[#0a0f1a] text-slate-100 min-h-screen">
<script>
  (function(){
    const email = localStorage.getItem('hail_email');
    if(!email){ location.replace('/gate'); return; }
    window.__hailEmail = email;
  })();
</script>

  <header class="sticky top-0 z-10 bg-[#0a0f1a] border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3">
      <a href="/" class="px-2 py-1 rounded-md border border-slate-700 text-sm">← Home</a>
      <div class="font-semibold">HAIL OS — Deen-Aligned Assistant</div>
      <div id="verdict" class="ml-auto text-xs text-slate-400 mr-3"></div>
      <div id="who" class="text-xs text-slate-400"></div>
      <button id="logout" class="ml-2 px-2 py-1 rounded-md border border-slate-700 text-xs hover:bg-slate-800">Sign out</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-4">
    <div id="chat" class="h-[68vh] overflow-y-auto space-y-3 pr-1">
      <div class="flex gap-3">
        <div class="msg msg-bot">As-salāmu ʿalaykum 👋 — How can I help?</div>
      </div>
    </div>

    <div class="mt-3 grid grid-cols-[1fr_auto] gap-2">
      <textarea id="input" rows="2" placeholder="Type your message…"
        class="w-full resize-none rounded-md bg-slate-900 border border-slate-700 px-3 py-2 outline-none"></textarea>
      <button id="send" class="px-4 rounded-md bg-emerald-500 text-emerald-950 font-semibold">Send</button>
    </div>
    <div class="text-[11px] text-slate-500 mt-1">Enter = send • Shift+Enter = newline</div>
  </main>

  <script>
    const chat = document.getElementById('chat');
    const verdictBox = document.getElementById('verdict');
    const who = document.getElementById('who');
    who.textContent = 'Signed in: ' + (window.__hailEmail || '');

    document.getElementById('logout').onclick = ()=>{
      localStorage.removeItem('hail_email');
      location.replace('/gate');
    };

    function escapeHtml(s){ return s.replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) }
    function bubble(text, who='bot'){
      const row = document.createElement('div');
      row.className = 'flex gap-3 ' + (who==='user' ? 'justify-end' : '');
      row.innerHTML = who==='user'
        ? `<div class="msg msg-user">${escapeHtml(text)}</div>`
        : `<div class="msg msg-bot">${escapeHtml(text)}</div>`;
      chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
    }

    async function send(){
      const ta = document.getElementById('input');
      const text = ta.value.trim();
      if(!text) return;
      bubble(text,'user'); ta.value='';
      verdictBox.textContent = '…';
      try{
        const r = await fetch('/ask', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ question: text })
        });
        const d = await r.json();

        if(d?.verdict){
          const v = d.verdict;
          const score = typeof d.score==='number' ? d.score.toFixed(3) : '—';
          verdictBox.textContent = `verdict: ${v} • score: ${score}`;
        }else{
          verdictBox.textContent = '';
        }
        bubble(d?.answer ?? 'No response.');
      }catch(e){
        verdictBox.textContent = 'error'; bubble('Error contacting backend.');
        console.error(e);
      }
    }
    document.getElementById('send').onclick = send;
    document.getElementById('input').addEventListener('keydown', (e)=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
